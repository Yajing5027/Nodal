name: Publish three-card Practice UI once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-three-math-ui-once.yml

permissions:
  contents: write

concurrency:
  group: publish-three-math-ui-once
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_ZIP_URL: https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-9220-822f-8554-4996c5b79267/raw?se=2026-10-20T19%3A17%3A56Z&sp=r&sv=2026-02-06&sr=b&scid=6d2b1511-2c28-5238-ad0c-dc3dfd059d09&skoid=dd316919-ffbf-4550-9c54-dfc99f412009&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-19T21%3A11%3A34Z&ske=2026-10-20T21%3A11%3A34Z&sks=b&skv=2026-02-06&sig=AE0QGUQk8wqELVGi0olDzSA2jJxFmO7/FoidVXngxPg%3D
      EXPECTED_ZIP_SHA256: fa6dc99b9435829c04f28c2a67058c425b70f401f723526eb0a9d05c5b8b1d15
      BEFORE_WORKFLOW_SHA: 85ed819f47b54d1fd090cf1788d6d764ba62205a
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify no unexpected public commit
        run: |
          test "$(git rev-parse HEAD^)" = "$BEFORE_WORKFLOW_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Download pinned, audited static distribution
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 "$RELEASE_ZIP_URL" -o "$RUNNER_TEMP/site.zip"
          echo "$EXPECTED_ZIP_SHA256  $RUNNER_TEMP/site.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/site"
          unzip -q "$RUNNER_TEMP/site.zip" -d "$RUNNER_TEMP/site"
      - name: Verify only three-card public UI assets will be added
        run: |
          python - <<'PY'
          import json,os,pathlib,re,shutil,subprocess
          root=pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          dist=pathlib.Path(os.environ['RUNNER_TEMP'])/'site'
          js=sorted(p for p in (dist/'assets').glob('*.js') if not (root/'assets'/p.name).exists())
          assert len(js)==37, f'Expected exactly 37 new compiled assets, got {len(js)}'
          assert all(re.fullmatch(r'[A-Za-z0-9_.-]+[.]js',p.name) for p in js)
          assert b'Load verified history from site' in (dist/'assets/DataPage-BGOCkBsK.js').read_bytes()
          archive='practice/2026-10-19-three-math-cards.json'
          assert (dist/archive).read_bytes()==(root/archive).read_bytes(), 'Published archive is not exact'
          data=json.loads((root/archive).read_bytes())
          assert data['schemaVersion']=='nodal.three-math-practice-history.v1'
          assert len(data['retrievalTargets'])==3 and len(data['memoryStates'])==3 and len(data['reviewEvents'])==11
          assert 'ReviewEvent' not in (dist/'index.html').read_text()
          for p in js: shutil.copy2(p,root/'assets'/p.name)
          shutil.copy2(dist/'index.html',root/'index.html')
          allowed_added={'assets/'+p.name for p in js}
          subprocess.check_call(['git','add','--','index.html']+sorted(allowed_added))
          diff=subprocess.check_output(['git','diff','--cached','--name-status','--no-renames'],text=True)
          rows=[row.split('\t',1) for row in diff.splitlines() if row.strip()]
          assert {p for op,p in rows if op=='A'}==allowed_added
          assert {p for op,p in rows if op=='M'}=={'index.html'}
          assert len(rows)==38
          print('PASS: 37 new JS assets and updated index.html; all existing Notes, AI, Maps and Practice JSON untouched')
          PY
      - name: Publish web UI by fast-forward
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: load published October 19 Practice into Nodal'
          git push origin HEAD:main
